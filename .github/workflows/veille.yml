name: Veille sénateurs normands - test manuel

# Se lance uniquement quand on clique sur "Run workflow" dans l'onglet
# Actions de GitHub (pas de déclenchement automatique pour l'instant :
# on valide d'abord que tout marche avant de programmer une fréquence).
on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le contenu du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4

      - name: Lancer les tests hors-ligne (aucun accès réseau requis)
        run: |
          python3 test_parsing_offline.py
          python3 test_parsing_rapports_offline.py
          python3 test_parsing_votes_offline.py

      - name: Lancer le téléchargement des questions écrites (Open Data du Sénat)
        run: python3 fetch_activite_senateurs.py

      - name: Lancer le scraping des rapports et propositions de loi (accès à senat.fr)
        run: python3 fetch_rapports_propositions.py

      # Diagnostic : affiche les vraies colonnes des fichiers sources de
      # NosParlementaires.fr dans les logs, pour vérifier/ajuster le
      # script si besoin (schéma non confirmé à l'avance, voir le
      # commentaire en tête de fetch_positions_vote.py).
      - name: Diagnostic positions de vote (colonnes réelles)
        run: python3 fetch_positions_vote.py --inspect

      # continue-on-error : le schéma réel n'a pas pu être vérifié avant
      # ce premier run, mieux vaut que les 2 autres catégories restent
      # disponibles dans l'artifact même si celle-ci échoue encore.
      - name: Lancer le téléchargement des positions de vote
        continue-on-error: true
        run: python3 fetch_positions_vote.py

      - name: Sauvegarder les résultats (téléchargeables depuis cette page)
        uses: actions/upload-artifact@v4
        with:
          name: donnees-senateurs
          path: |
            activite-senateurs-data.json
            rapports-propositions-senateurs-data.json
            positions-vote-senateurs-data.json
          if-no-files-found: warn
